# Version of the MCOneWorld shared libraries. Persistent formats and the network protocol carry
# their own independent versions; never use this value as a format version (shared/AGENTS.md).
version=0.1.0-SNAPSHOT

# A local JDK 25 is required; toolchains are never downloaded implicitly (ADR 0002, Q10).
org.gradle.java.installations.auto-download=false

org.gradle.configuration-cache=true
org.gradle.caching=false
org.gradle.parallel=true
org.gradle.warning.mode=fail
